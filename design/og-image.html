<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Brand values mirror app/globals.css: dark theme background #0F353D,
     primary #48B9D1, foreground #E9F6F9, muted-foreground #9AC0CB.
     No figures live on this image: every number the page states derives
     from the committed snapshot through the meta description, so the
     image never goes stale between weekly rebuilds. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    background: #0F353D;
    color: #E9F6F9;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 64px;
    position: relative;
  }
  /* Decorative pixel grid echoing app/icon.svg, top right. */
  .pixels {
    position: absolute;
    right: 80px;
    top: 72px;
    width: 96px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    opacity: 0.9;
  }
  .pixels span {
    width: 25px;
    height: 25px;
    border-radius: 4px;
    background: #48B9D1;
  }
  .pixels span:nth-child(4), .pixels span:nth-child(8) {
    background: transparent;
  }
  .kicker {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #48B9D1;
    margin-bottom: 24px;
  }
  /* The product name in the family display style the page's hero uses:
     top weight, capitals, tight tracking. */
  h1 {
    font-size: 64px;
    line-height: 1.04;
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    text-wrap: balance;
    max-width: 980px;
  }
  /* Stable tagline: the product's question in the family accent, then
     the standing promise. Nothing here changes with the data. */
  .tagline {
    margin-top: 28px;
    font-size: 30px;
    line-height: 1.4;
    color: #9AC0CB;
    max-width: 860px;
  }
  .tagline strong {
    font-weight: 700;
    color: #48B9D1;
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #225662;
    padding-top: 28px;
  }
  .domain {
    font-size: 26px;
    font-weight: 600;
  }
  .domain em {
    font-style: normal;
    color: #48B9D1;
  }
  .meta {
    font-size: 22px;
    color: #9AC0CB;
  }
</style>
</head>
<body>
  <div class="pixels" aria-hidden="true">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>
  <div>
    <p class="kicker">Dutch open data, visualized by Pixelate</p>
    <h1>Dutch Fleet Electrification Explorer</h1>
    <p class="tagline"><strong>How electric is the Dutch fleet?</strong> Live aggregates from the complete RDW vehicle register, refreshed weekly.</p>
  </div>
  <footer>
    <div class="domain"><em>fleet</em>.pixelate.nl</div>
    <div class="meta">RDW open data &middot; refreshed weekly</div>
  </footer>
</body>
</html>
