<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Brand values mirror app/globals.css: dark theme background #0F353D,
     primary #48B9D1, foreground #E9F6F9, muted-foreground #9AC0CB. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    background: #0F353D;
    color: #E9F6F9;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 64px;
    position: relative;
  }
  /* Decorative pixel grid echoing app/icon.svg, bottom right. */
  .pixels {
    position: absolute;
    right: 80px;
    top: 72px;
    width: 96px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    opacity: 0.9;
  }
  .pixels span {
    width: 25px;
    height: 25px;
    border-radius: 4px;
    background: #48B9D1;
  }
  .pixels span:nth-child(4), .pixels span:nth-child(8) {
    background: transparent;
  }
  .kicker {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #48B9D1;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 68px;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.02em;
    max-width: 820px;
  }
  .share {
    display: flex;
    align-items: baseline;
    gap: 28px;
    margin-top: 12px;
  }
  .share .number {
    font-size: 132px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #48B9D1;
  }
  .share .label {
    font-size: 28px;
    line-height: 1.3;
    color: #9AC0CB;
    max-width: 560px;
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #225662;
    padding-top: 28px;
  }
  .domain {
    font-size: 26px;
    font-weight: 600;
  }
  .domain em {
    font-style: normal;
    color: #48B9D1;
  }
  .meta {
    font-size: 22px;
    color: #9AC0CB;
  }
</style>
</head>
<body>
  <div class="pixels" aria-hidden="true">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>
  <div>
    <p class="kicker">Dutch open data, visualized by Pixelate</p>
    <h1>How electric is the Dutch fleet?</h1>
  </div>
  <div class="share">
    <div class="number">19.5%</div>
    <div class="label">of vehicles with fuel data in the complete RDW vehicle register run electric</div>
  </div>
  <footer>
    <div class="domain"><em>fleet</em>.pixelate.nl</div>
    <div class="meta">RDW snapshot 1 November 2026 &middot; refreshed weekly</div>
  </footer>
</body>
</html>
